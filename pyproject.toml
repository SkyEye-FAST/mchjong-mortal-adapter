[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mchjong-mortal-adapter"
version = "0.1.0"
description = "Local Mortal inference service for MChjong"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "torch>=2.5,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[project.scripts]
mchjong-mortal-adapter = "mchjong_mortal_adapter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mchjong_mortal_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
